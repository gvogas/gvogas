<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 | George Vogas</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/gvogas/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:ital,wght@0,400;0,500&display=swap" rel="stylesheet" />
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/gvogas/styles.css" />
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      padding: 28px;
    }
    .notfound__title {
      font-size: clamp(2.4rem, 7vw, 4.4rem);
      margin-bottom: 20px;
    }
    .notfound__title em { font-style: italic; color: var(--accent); }
    .notfound__body {
      color: var(--muted);
      max-width: 440px;
      margin: 0 auto 38px;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="hero__content">
      <h1 class="notfound__title">Puck's <em>out of play.</em></h1>
      <p class="notfound__body">
        Whatever you were looking for isn't at this address. The link may be
        old, or I may have moved it.
      </p>
      <a href="/gvogas/" class="btn btn--primary">← Back to the site</a>
    </div>
  </main>
</body>
</html>
