name: Generate contribution snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: gvogas
          outputs: |
            dist/github-snake.svg?color_snake=#1e40af&color_dots=#e1ecf7,#bfdcf5,#7fbcf0,#3b82f6,#1e40af
            dist/github-snake-dark.svg?color_snake=#b6dbff&color_dots=#172238,#1f3a6b,#2f66c4,#5aa9ff,#b6dbff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
