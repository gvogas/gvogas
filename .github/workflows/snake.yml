name: Generate contribution snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: gvogas
          outputs: |
            dist/github-snake.svg?color_snake=#9a3412&color_dots=#ece7dc,#f6c9a8,#f0955c,#d9622a,#9a3412
            dist/github-snake-dark.svg?color_snake=#f7b98f&color_dots=#26231e,#4a3325,#8a4520,#d9622a,#f7b98f

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
