name: Generate contribution snake and repo snapshot

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: gvogas
          outputs: |
            dist/github-snake.svg?color_snake=#1e40af&color_dots=#e1ecf7,#bfdcf5,#7fbcf0,#3b82f6,#1e40af
            dist/github-snake-dark.svg?color_snake=#b6dbff&color_dots=#172238,#1f3a6b,#2f66c4,#5aa9ff,#b6dbff

      - name: Snapshot public repos for the portfolio skyline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The snake action runs in Docker as root, so dist/ is root-owned.
          sudo mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/gvogas/repos?per_page=100&sort=pushed" \
            | jq '[.[] | {name, html_url, language, size, pushed_at, stargazers_count, fork, description}]' \
            > dist/repos.json
          test "$(jq length dist/repos.json)" -gt 0

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
